
<script>
(function () {
  const tabButtons = document.querySelectorAll('.tab-btn');
  const tabs = {
    analysis: document.getElementById('tab-content-analysis'),
    fixed: document.getElementById('tab-content-fixed'),
    diff: document.getElementById('tab-content-diff')
  };

  function activateTab(tabKey) {
    tabButtons.forEach(btn => {
      const active = btn.dataset.tab === tabKey;
      btn.classList.toggle('text-primary', active);
      btn.classList.toggle('font-semibold', active);
      btn.classList.toggle('text-on-surface-variant', !active);
      btn.classList.toggle('font-medium', !active);
    });

    Object.keys(tabs).forEach(key => {
      tabs[key].classList.toggle('hidden', key !== tabKey);
    });
  }

  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => activateTab(btn.dataset.tab));
  });

  document.getElementById('switch-to-diff-btn')
    ?.addEventListener('click', () => activateTab('diff'));

  const toast = document.getElementById('editor-toast');
  const toastMsg = document.getElementById('toast-msg');
  let toastTimer;

  function showToast(message) {
    if (!toast || !toastMsg) return;

    toastMsg.textContent = message;
    toast.classList.remove('hidden');
    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
      toast.classList.add('hidden');
    }, 4000);
  }

  const btnFixCode = document.getElementById('btn-fix-code');
  const fixSpinner = document.getElementById('fix-spinner');
  const fixBolt = document.getElementById('fix-bolt');

  const fixedCodeContainer = document.querySelector(
    '#tab-content-fixed .bg-surface-container-lowest.rounded-xl'
  );

  const copyBtn = document.getElementById('btn-copy-code');
  const copyBtnText = document.getElementById('copy-btn-text');

  let latestFixedCode = '';

  // Source code currently displayed in the editor.
  // Update this value when the editor becomes truly editable.
  const sourceCode = `// Calculate greeting for authenticated developer
function hello(name {
    const timestamp = new Date().toISOString();
    console.log("Hello " + name);
    return { success: true, user: name };
}

// Trigger greeting execution
hello("Developer");`;

  async function fixCode() {
    if (!btnFixCode || btnFixCode.disabled) return;

    btnFixCode.disabled = true;
    if (fixBolt) fixBolt.style.display = 'none';
    if (fixSpinner) fixSpinner.style.display = 'inline-block';

    showToast('Connecting to Gemini... Please wait.');

    try {
      const languageSelect = document.querySelector('header select');
      const language = languageSelect?.value || 'javascript';

      const response = await fetch(
        'https://codefix-ia.onrender.com/api/fix',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            code: sourceCode,
            language: language
          })
        }
      );

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          data.error || data.message ||
          `Server error (${response.status})`
        );
      }

      if (!data.success || typeof data.fixedCode !== 'string') {
        throw new Error(data.error || 'The server returned no fixed code.');
      }

      latestFixedCode = data.fixedCode;

      // Show the actual API result in the existing Fixed Code panel.
      if (fixedCodeContainer) {
        fixedCodeContainer.textContent = latestFixedCode;
        fixedCodeContainer.style.whiteSpace = 'pre';
      }

      activateTab('fixed');
      showToast('Gemini returned the corrected code successfully.');

    } catch (error) {
      console.error('CodeFix API error:', error);

      showToast(
        'Fix failed: ' +
        (error.message || 'Could not connect to the server.')
      );
    } finally {
      btnFixCode.disabled = false;

      if (fixSpinner) fixSpinner.style.display = 'none';
      if (fixBolt) fixBolt.style.display = 'inline-block';
    }
  }

  btnFixCode?.addEventListener('click', fixCode);

  // Copy the latest result returned by the API.
  copyBtn?.addEventListener('click', async () => {
    if (!latestFixedCode) {
      showToast('Click Fix Code first to get the corrected code.');
      return;
    }

    try {
      await navigator.clipboard.writeText(latestFixedCode);

      if (copyBtnText) {
        copyBtnText.textContent = 'Copied!';
        setTimeout(() => {
          copyBtnText.textContent = 'Copy Code';
        }, 2000);
      }

      showToast('Corrected code copied.');
    } catch (error) {
      showToast('Could not copy automatically. Please copy the code manually.');
    }
  });

  // Keep the existing editor controls and visual layout.
  const brokenLine = document.getElementById('line-broken');
  const gutterLine2 = document.getElementById('gutter-line-2');

  function applyFixToEditor() {
    if (!brokenLine || !latestFixedCode) {
      showToast('Run Fix Code first to get a real result from Gemini.');
      return;
    }

    const correctedLine = latestFixedCode
      .split('\n')
      .find(line => /^\s*function\s+hello\s*\(/.test(line));

    if (!correctedLine) {
      showToast('The result is ready in Fixed Code, but no matching editor line was found.');
      return;
    }

    brokenLine.textContent = correctedLine.trim();

    if (gutterLine2) {
      gutterLine2.classList.remove('text-error');
      gutterLine2.classList.add('text-outline');
      gutterLine2.innerHTML = '<span>2</span>';
    }

    showToast('Updated the displayed function line.');
  }

  document.getElementById('apply-to-editor-btn')
    ?.addEventListener('click', applyFixToEditor);

  document.getElementById('apply-patch-direct-btn')
    ?.addEventListener('click', applyFixToEditor);

  document.getElementById('diff-accept-btn')
    ?.addEventListener('click', () => {
      applyFixToEditor();
      activateTab('fixed');
    });

  document.addEventListener('keydown', event => {
    if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
      event.preventDefault();
      btnFixCode?.click();
    }
  });

  document.getElementById('btn-clear')?.addEventListener('click', () => {
    showToast('Clear is not connected to an editable code buffer yet.');
  });

  document.getElementById('btn-paste')?.addEventListener('click', () => {
    showToast('Paste is not connected to an editable code buffer yet.');
  });

  // Remove the inaccurate Claude model label.
  document.querySelectorAll('span').forEach(span => {
    if (span.textContent.includes('AI Model: Claude 3.5 Sonnet')) {
      span.textContent = 'AI Model: Google Gemini 2.5 Flash & CodeFix Engine';
    }
  });
})();
</script>
